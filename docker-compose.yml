version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agroskan-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-agroskan}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-@AgroskanPostgres2026!}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agroskan"]
      interval: 5s
      timeout: 5s
      retries: 5
    # A porta não é exposta externamente por motivos de segurança, apenas acessível dentro da rede docker

  backend:
    build:
      context: ./backend
    container_name: agroskan-backend
    restart: always
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-@AgroskanPostgres2026!}@db:5432/${DB_NAME:-agroskan}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-@AgroskanSecretKey2026Drone!}
      NODE_ENV: production
    volumes:
      - uploads-data:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: agroskan-frontend
    restart: always
    # Rodará internamente com seu próprio nginx servindo os estáticos compilados

  nginx-proxy:
    image: nginx:alpine
    container_name: agroskan-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - wordpress

  certbot:
    image: certbot/certbot
    container_name: agroskan-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit 0; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  wp-db:
    image: mariadb:10.6
    container_name: agroskan-wp-db
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: "@AgroskanWpDb2026!"
      MYSQL_ROOT_PASSWORD: "@AgroskanWpRoot2026!"
    volumes:
      - wp-db-data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: agroskan-wordpress
    restart: always
    depends_on:
      - wp-db
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: "@AgroskanWpDb2026!"
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html

volumes:
  db-data:
  uploads-data:
  certbot-etc:
  certbot-var:
  wp-db-data:
  wp-data:
