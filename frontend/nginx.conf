server {
    listen 80;
    root /usr/share/nginx/html;

    # Arquivos críticos do PWA que NUNCA devem ser cacheados pelo navegador
    location ~* ^/(sw\.js|manifest\.json|version\.json|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Assets versionados pelo Vite (hashes imutáveis no nome do arquivo)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA padrão
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Encaminha erros do servidor para a página padrão
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
