server {
    listen 80;
    server_name agroskan.com www.agroskan.com app.agroskan.com;

    # Validação do Certbot SSL Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona HTTP para HTTPS de forma dinâmica
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.agroskan.com;

    # Certificados SSL gerados pelo Certbot (serão expandidos)
    ssl_certificate /etc/letsencrypt/live/agroskan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agroskan.com/privkey.pem;

    # Configurações SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy para a API Backend Node.js
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }

    # Proxy para o Frontend SPA React (Nginx interno)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name agroskan.com www.agroskan.com;

    # Certificados SSL gerados pelo Certbot (mesmo arquivo após a expansão)
    ssl_certificate /etc/letsencrypt/live/agroskan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agroskan.com/privkey.pem;

    # Configurações SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy para o container WordPress
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
